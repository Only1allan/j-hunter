# Employers to probe with `jobapp discover-boards`.
#
# This file is INPUT, not output. It lists company *names*; the discovery command
# works out which applicant tracking system each one publishes on and writes the
# verified board tokens into companies.yaml. Nothing here is assumed to be
# reachable — a name that resolves to no board is simply reported and skipped.
#
# Grouped by why the employer is on the list, because that is what makes the list
# maintainable. The candidate is Nairobi-based, senior, open to relocation, so
# three things qualify an employer: it hires remotely at global rates, it hires in
# East Africa, or it sponsors relocation into Europe.

# --- Kenya and East Africa ---------------------------------------------------
# Nairobi's venture-funded tech scene. Most pay above local market and several
# hire regionally across East Africa.
