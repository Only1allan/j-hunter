# Target companies, keyed by the ATS hosting their public job board.
#
# Maintained by `jobapp discover-boards --write`, which probes every
# supported ATS for each name in seed-companies.yaml and keeps only the
# boards that actually answered. Hand edits are preserved on merge.
#
# Curating this list is the highest-leverage tuning in the pipeline: it
# decides which companies you apply to at all.

