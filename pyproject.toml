[project]
name = "job-app-system"
version = "0.1.0"
description = "AI-driven job application pipeline: source of truth -> lead gen -> tailored output"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "weasyprint>=62.0",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "crawlee[beautifulsoup]>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jobapp = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
